version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/intellmeet
      - JWT_SECRET=intellmeet_enterprise_jwt_super_secret_key_2026_xyz
      - JWT_REFRESH_SECRET=intellmeet_enterprise_jwt_refresh_secret_key_2026_xyz
      - JWT_EXPIRE=7d
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - intellmeet-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - intellmeet-network

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - intellmeet-network

networks:
  intellmeet-network:
    driver: bridge

volumes:
  mongo-data:
